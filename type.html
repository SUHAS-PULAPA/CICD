
<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous" />
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
<link rel="stylesheet" href="index.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" >
<meta name="robots" content="none,noarchive"/>
</head>

<body>
    <div class="bod1">
        <h1 class="head">Speed Typing Test</h1>
        <p class="para">On your fingers lets set Go!</p>
        <div class="d-flex flex-row justify-content-center">
            <img src="https://assets.ccbp.in/frontend/dynamic-webapps/clock-img.png" class="mr-3" style="width:50px;height:50px" alt="" />
            <p class="sec mr-3" id="timer">0</p>
        </div>
        <div class="bod2" id="speedTypingTest">
            <div class="d-none" id="spinner">
                <div class="d-flex justify-content-center">
                    <div class="spinner-border" role="status">
                    </div>
                </div>
            </div>
            <p id="quoteDisplay"></p>
            <textarea name="" id="quoteInput" rows="4" cols="30" style="border-radius:8px; padding:8px;"></textarea>
        </div>
        <p class="m-2 p-3" id="result" style="font-size:large; font-weight:bold;"></p>
        <button type="submit" class="btn butn" id="submitBtn">Submit</button>
        <button type="reset" class="btn btn-light" id="resetBtn">Reset</button>
    </div>
<script>
  let time = document.getElementById("timer");
let quote = document.getElementById("quoteDisplay");
let res = document.getElementById("result");
let text = document.getElementById("quoteInput");
let subbtn = document.getElementById("submitBtn");
let resetbtn = document.getElementById("resetBtn");
let spin = document.getElementById("spinner");

let uid;

function resbtn() {
    time.textContent = "0 seconds";
    text.value = "";
    res.textContent = "";
    spin.classList.remove("d-none");
    let options = {
        method: "GET"
    };
    fetch("https://apis.ccbp.in/random-quote", options)
        .then(function(response) {
            return response.json();
        })
        .then(function(jsonData) {
            spin.classList.add("d-none");
            let {
                content
            } = jsonData;
            quote.textContent = content;
        });

    uid = setInterval(function() {
        let a = parseInt(time.textContent);
        a += 1;
        time.textContent = a + " seconds";
    }, 1000);
}
resbtn();
resetbtn.addEventListener("click", resbtn);

subbtn.addEventListener("click", function fxn() {

    if (quote.textContent === text.value) {
        res.textContent = "Good, you typed in " + time.textContent + " seconds";
        res.style.color = "green";
        clearInterval(uid);
    } else {
        res.textContent = "You typed incorrect sentence !";
        res.style.color = "red";
    }
})
</script>
</body>

</html>
